name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Paketlarni o'rnatish
        run: npm ci

      - name: Testlar
        run: npm test
        env:
          TZ_NAME: Asia/Tashkent

  deploy:
    name: Serverga deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Secretlarni tekshirish
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          missing=""
          for name in SERVER_HOST SERVER_USER SSH_KEY BOT_TOKEN; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Quyidagi secretlar topilmadi:$missing. Settings → Secrets and variables → Actions → Secrets (Repository secrets yoki 'production' environment) ga qo'shing."
            exit 1
          fi

      - name: SSH orqali deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: BOT_TOKEN,TZ_NAME,APP_DIR,REPO_URL
          script: |
            set -e
            # Birinchi marta: repozitoriyni klonlash
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            # .env faylini GitHub Secrets'dan yaratish.
            # Ma'lumotlar data/db.json da saqlanadi (.gitignore da, deploy paytida o'chmaydi).
            cat > .env <<EOF
            BOT_TOKEN=$BOT_TOKEN
            DATA_FILE=$APP_DIR/data/db.json
            TZ_NAME=$TZ_NAME
            EOF
            sed -i 's/^[[:space:]]*//' .env
            chmod 600 .env

            npm ci --omit=dev

            # PM2 bilan qayta ishga tushirish
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2
            pm2 restart vazifa-bot --update-env || pm2 start index.js --name vazifa-bot
            pm2 save
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TZ_NAME: ${{ vars.TZ_NAME || 'Asia/Tashkent' }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/task_bot' }}
          REPO_URL: https://github.com/${{ github.repository }}.git
